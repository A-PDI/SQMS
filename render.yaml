# Render Blueprint: SQMS evaluation/test deployment (see docs/deployment.md, "Render").
# Create it in the Render Dashboard with New > Blueprint, then choose this repository and branch.
#
# Only sqms-gateway is public (Render terminates HTTPS). The web app, API, MySQL, MinIO, ClamAV and Mailpit are
# private services and Redis is a Render Key Value instance without external access. Passwords and keys are
# generated by Render; the values marked sync: false are requested when the Blueprint is created.

envVarGroups:
  # Settings shared by the API and the worker.
  - name: sqms-app-settings
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: CSRF_SECRET
        generateValue: true
      - key: CARBONZAPP_MODE
        value: disabled
      - key: INJECTOR_SHEET_MODE
        value: disabled
      - key: SUPPLIER_PORTAL_ENABLED
        value: "false"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: SCANNER_MODE
        value: clamav
      - key: CLAMAV_PORT
        value: "3310"
      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_PORT
        value: "1025"
      - key: MAIL_FROM
        value: SQMS <no-reply@sqms.local>
      - key: S3_REGION
        value: us-east-1
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: DATABASE_CONNECTION_LIMIT
        value: "10"
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: log

  # Application database account (MySQL creates it on first start; the API and worker connect with it).
  - name: sqms-database
    envVars:
      - key: SQMS_DB_NAME
        value: sqms
      - key: SQMS_APP_USER
        value: sqms_app
      - key: SQMS_APP_PASSWORD
        generateValue: true

  # Schema-migration account, used only by the API's pre-deploy command.
  - name: sqms-database-migrator
    envVars:
      - key: SQMS_MIGRATOR_USER
        value: sqms_migrator
      - key: SQMS_MIGRATOR_PASSWORD
        generateValue: true

  # Bucket and the bucket-scoped application account (MinIO creates them on start).
  - name: sqms-storage
    envVars:
      - key: S3_BUCKET
        value: sqms-files
      - key: S3_ACCESS_KEY_ID
        value: sqms-app
      - key: S3_SECRET_ACCESS_KEY
        generateValue: true

services:
  - type: web
    name: sqms-gateway
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infra/render/gateway.Dockerfile
    dockerContext: ./infra/render
    healthCheckPath: /gateway-health
    buildFilter:
      paths:
        - infra/render/Caddyfile
        - infra/render/gateway.Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: SQMS_API_HOST
        fromService:
          type: pserv
          name: sqms-api
          property: host
      - key: SQMS_WEB_HOST
        fromService:
          type: pserv
          name: sqms-web
          property: host
      - key: SQMS_MAILPIT_HOST
        fromService:
          type: pserv
          name: sqms-mailpit
          property: host

  - type: pserv
    name: sqms-web
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildFilter:
      ignoredPaths:
        - docs/**
        - e2e/**
        - "**/*.md"
    envVars:
      - key: SQMS_SERVICE
        value: web
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0

  - type: pserv
    name: sqms-api
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations and the idempotent reference seed (also creates the first administrator).
    preDeployCommand: sqms-env sqms-migrate
    buildFilter:
      ignoredPaths:
        - docs/**
        - e2e/**
        - "**/*.md"
    envVars:
      - key: SQMS_SERVICE
        value: api-render
      - key: PORT
        value: "4000"
      - fromGroup: sqms-app-settings
      - fromGroup: sqms-database
      - fromGroup: sqms-database-migrator
      - fromGroup: sqms-storage
      - key: SQMS_PUBLIC_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: SQMS Administrator
      - key: SQMS_DB_HOST
        fromService:
          type: pserv
          name: sqms-mysql
          property: host
      - key: SQMS_MINIO_HOST
        fromService:
          type: pserv
          name: sqms-minio
          property: host
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: sqms-clamav
          property: host
      - key: SMTP_HOST
        fromService:
          type: pserv
          name: sqms-mailpit
          property: host
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sqms-redis
          property: connectionString

  - type: worker
    name: sqms-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildFilter:
      ignoredPaths:
        - docs/**
        - e2e/**
        - "**/*.md"
    envVars:
      - key: SQMS_SERVICE
        value: worker-render
      - fromGroup: sqms-app-settings
      - fromGroup: sqms-database
      - fromGroup: sqms-storage
      - key: SQMS_PUBLIC_URL
        sync: false
      - key: SQMS_DB_HOST
        fromService:
          type: pserv
          name: sqms-mysql
          property: host
      - key: SQMS_MINIO_HOST
        fromService:
          type: pserv
          name: sqms-minio
          property: host
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: sqms-clamav
          property: host
      - key: SMTP_HOST
        fromService:
          type: pserv
          name: sqms-mailpit
          property: host
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sqms-redis
          property: connectionString

  - type: pserv
    name: sqms-mysql
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infra/render/mysql.Dockerfile
    dockerContext: .
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    buildFilter:
      paths:
        - infra/mysql/**
        - infra/render/mysql.Dockerfile
        - infra/render/mysql.cnf
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: SQMS_REPORTER_PASSWORD
        generateValue: true
      - fromGroup: sqms-database
      - fromGroup: sqms-database-migrator

  - type: pserv
    name: sqms-minio
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./infra/minio/Dockerfile
    dockerContext: ./infra/minio
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10
    buildFilter:
      paths:
        - infra/minio/**
    envVars:
      - key: SQMS_MINIO_IMAGE
        value: minio-render
      - key: MINIO_ROOT_USER
        value: sqms-root
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
      - key: MINIO_BROWSER
        value: "off"
      - fromGroup: sqms-storage

  # Malware scanning; needs about 1-1.5 GB of memory. Non-concurrent signature reloads keep it from doubling.
  - type: pserv
    name: sqms-clamav
    runtime: image
    region: oregon
    plan: standard
    image:
      url: docker.io/clamav/clamav:1.5.4
    envVars:
      - key: CLAMD_CONF_ConcurrentDatabaseReload
        value: "no"

  # Mail inbox for evaluation, shown at <gateway URL>/mailpit/ (sign-in from MP_UI_AUTH, "user:password").
  - type: pserv
    name: sqms-mailpit
    runtime: image
    region: oregon
    plan: starter
    image:
      url: docker.io/axllent/mailpit:v1.31.5
    envVars:
      - key: MP_WEBROOT
        value: /mailpit/
      - key: MP_UI_AUTH
        sync: false
      - key: MP_MAX_MESSAGES
        value: "1000"

  # BullMQ queues: no eviction, reachable only from this workspace's private network.
  - type: keyvalue
    name: sqms-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
